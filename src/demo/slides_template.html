<style>

order:1px solid #bacbd6;border-radius:3px;color:var(--ink)}.demo-toolbar>span{margin-left:auto;color:var(--accent)}.demo-question{font-size:1.65cqw;font-style:italic;margin-bottom:1.6cqw!important;min-height:2cqw}.demo-columns h3{font-size:1.8cqw;border-bottom:2px solid var(--line);padding-bottom:.8cqw}.demo-columns h3 small{float:right;font-size:1.25cqw;font-weight:400;color:var(--muted)}.demo-columns ol{padding-left:1.8cqw;margin:.5cqw 0}.demo-columns li{font-size:1.45cqw;line-height:1.3;padding:.6cqw 0 .8cqw .4cqw;max-height:none;overflow:visible}.demo-columns li small{display:block;font-size:1.08cqw;color:var(--muted);margin-top:.35cqw}.nav{height:64px;max-width:1440px;margin:auto;padding:9px 26px;display:flex;align-items:center;gap:12px}.nav button{border:1px solid #c5d4de;border-radius:5px;background:#fff;color:var(--ink);padding:8px 13px;font-size:14px;min-height:35px}.nav button:disabled{opacity:.4;cursor:default}.nav .spacer{flex:1}.nav input{width:min(24vw,260px);accent-color:var(--accent)}.counter{font-size:14px;color:var(--muted);min-width:52px;text-align:center}.keyhelp{font-size:12px;color:var(--muted)}#overview{display:none;position:fixed;inset:0;background:#eaf0f4f7;padding:50px;overflow:auto;z-index:4}#overview.open{display:block}.overview-top{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:auto}.overview-top h2{font-size:26px}.overview-top button{padding:10px 15px;border:1px solid #bacbd6;background:#fff;border-radius:5px}.overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:1200px;margin:24px auto}.overview-grid button{text-align:left;min-height:110px;padding:20px;border:1px solid #cad8e2;background:#fff;color:var(--ink);font-size:17px;line-height:1.4;border-radius:5px}.overview-grid button span{display:block;color:var(--accent);font-size:13px;margin-bottom:8px}.overview-grid button.current{border:2px solid var(--accent)}.notes{position:absolute;left:3cqw;right:3cqw;bottom:2.8cqw;background:#fffef2;border:1px solid #d9d0a6;box-shadow:0 8px 20px #18364b20;padding:1.6cqw 2cqw;color:#413b26;font-size:1.5cqw;line-height:1.45;z-index:2}.notes:before{content:'Ghi chú trình bày';display:block;font-weight:650;margin-bottom:.6cqw}body:fullscreen{background:var(--back)}body:fullscreen .app-head{display:none}body:fullscreen .stage{width:min(100vw,calc((100svh - 68px)*16/9));margin-top:0}.nav-status{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
@media(max-width:700px){.app-head{height:42px;padding:0 14px}.app-head>div>span,.keyhelp{display:none}.stage{width:calc(100vw - 20px);aspect-ratio:auto;min-height:calc(100svh - 120px);container-type:normal}.slide{position:relative;min-height:calc(100svh - 120px);padding:28px 22px 24px;overflow:visible}.slide h2{font-size:29px;letter-spacing:-.7px;margin-bottom:24px}.slide .content{font-size:19px}.slide .source{font-size:11px;padding-top:10px;margin-top:24px}.slide h3{font-size:21px;margin-bottom:14px}.slide p{margin-bottom:16px}.small{font-size:14px;margin-top:18px!important}.takeaway,.takeaway.compact{font-size:22px;margin-top:24px!important}.points{gap:20px}.points li{grid-template-columns:26px 1fr;gap:10px}.points li:before{font-size:14px;padding-top:4px}table,.dense,.labels-layout table{font-size:12px}th{font-size:11px}th,td,.dense th,.dense td{padding:10px 5px}.cover h2{font-size:48px;margin-top:10px;margin-bottom:30px;letter-spacing:-2px}.cover-grid{grid-template-columns:1fr;gap:30px}.cover-sub{font-size:26px}.cover-line{font-size:16px;margin-top:24px!important}.cover-stat{padding:0;border:0}.cover-stat strong{font-size:62px;letter-spacing:-2px}.cover-stat span{font-size:15px}.pipeline{grid-template-columns:1fr 1fr;gap:24px;margin:25px 0}.pipeline>div{padding-top:10px}.pipeline b{font-size:14px}.pipeline strong{font-size:22px;margin:12px 0}.pipeline span{font-size:14px}.pipeline>div:after{display:none}.architecture{font-size:15px;padding:14px 0;margin-bottom:18px}.architecture span{margin:0 3px}.bar-chart{grid-template-columns:1fr;gap:24px;padding-top:0}.bar-group h3{font-size:23px;margin-bottom:12px}.bar-row{grid-template-columns:48px 1fr 52px;gap:8px;margin:10px 0;font-size:14px}.bar-row b{font-size:15px}.bar-track{height:22px}.delta{font-size:24px;margin-top:12px!important}.two-col,.labels-layout{grid-template-columns:1fr;gap:24px}.side-stat{padding:16px 0 0;border-left:0;border-top:1px solid var(--line)}.side-stat strong{font-size:58px}.side-stat p{font-size:18px}.case-note{margin-bottom:22px;padding-bottom:16px}.case-tag{font-size:12px}.case-note h3{margin:8px 0 12px}.case-note p{font-size:18px}.inline-stats{gap:14px;margin-bottom:24px}.inline-stats strong{font-size:23px}.inline-stats span{font-size:11px;margin-top:5px}.references{gap:16px}.references li{grid-template-columns:1fr;gap:4px;font-size:16px;padding-bottom:14px}.demo-toolbar{flex-wrap:wrap;gap:8px;font-size:13px}.demo-toolbar select{max-width:100%;font-size:14px;padding:7px}.demo-toolbar>span{margin-left:0}.demo-question{font-size:16px;min-height:50px}.demo-columns h3{font-size:20px}.demo-columns h3 small{font-size:13px}.demo-columns ol{padding-left:20px}.demo-columns li{font-size:16px;max-height:none;padding:8px 0}.demo-columns li small{font-size:12px}.nav{padding:10px;gap:7px}.nav button{font-size:12px;padding:7px 9px}.nav input{display:none}.nav .counter{font-size:12px;min-width:40px}.overview-grid{grid-template-columns:1fr}#overview{padding:22px}.notes{left:10px;right:10px;bottom:20px;padding:18px;font-size:15px}}
@media print{@page{size:13.333in 7.5in;margin:0}body{background:#fff}.app-head,.nav,#overview,.notes{display:none!important}.stage{width:1280px;aspect-ratio:auto;margin:0;border:0;box-shadow:none;container-type:inline-size}.slide{display:flex!important;position:relative;width:1280px;height:720px;break-after:page;page-break-after:always;print-color-adjust:exact;-webkit-print-color-adjust:exact}.slide:last-child{break-after:auto}.slide .source{margin-top:auto}}
</style></head>
<body><header class="app-head"><div><strong>BioRerank</strong><span>Đồ án NLP · Bản trình chiếu offline</span></div><div class="keyhelp">← → Chuyển trang · O Tổng quan · N Ghi chú · F Toàn màn hình</div></header>
<main class="stage" id="stage"><!-- SLIDES --></main>
<nav class="nav" aria-label="Điều khiển trình chiếu"><button id="prev" aria-label="Trang trước">← Trước</button><span id="counter" class="counter"></span><button id="next" aria-label="Trang tiếp theo">Tiếp →</button><input id="progress" type="range" min="1" max="17" value="1" aria-label="Chọn trang"><span class="spacer"></span><button id="overview-button" title="Phím O">Tổng quan</button><button id="notes-button" title="Phím N" aria-pressed="false">Ghi chú</button><button id="fullscreen" title="Phím F">Toàn màn hình</button></nav>
<div id="overview" role="dialog" aria-modal="true" aria-label="Tổng quan các trang" hidden><div class="overview-top"><h2>Nội dung trình bày</h2><button id="overview-close">Đóng · Esc</button></div><div class="overview-grid" id="overview-grid"></div></div><div id="status" class="nav-status" aria-live="polite"></div>
<script>
/* DATA */
const slides=[...document.querySelectorAll('.slide')],$=id=>document.getElementById(id);let current=0,notes=false;const total=slides.length;
function show(index,updateHash=true){current=Math.max(0,Math.min(total-1,index));slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',String(i!==current));s.querySelector('.notes').hidden=!notes||i!==current;});$('counter').textContent=(current+1)+' / '+total;$('progress').value=current+1;$('prev').disabled=current===0;$('next').disabled=current===total-1;$('status').textContent='Trang '+(current+1)+': '+DATA.titles[current];document.title=(current+1)+' · '+DATA.titles[current]+' — BioRerank';if(updateHash)history.replaceState(null,'','#'+(current+1));document.querySelectorAll('.overview-grid button').forEach((b,i)=>b.classList.toggle('current',i===current));}
function overview(open){$('overview').hidden=!open;$('overview').classList.toggle('open',open);if(open)document.querySelectorAll('.overview-grid button')[current].focus();else $('overview-button').focus();}
function toggleNotes(){notes=!notes;$('notes-button').setAttribute('aria-pressed',String(notes));show(current,false);}
async function fullscreen(){try{if(document.fullscreenElement)await document.exitFullscreen();else await document.body.requestFullscreen();}catch(e){$('status').textContent='Trình duyệt chưa cho phép toàn màn hình; bạn vẫn có thể trình chiếu bằng các phím mũi tên.';}}
$('prev').onclick=()=>show(current-1);$('next').onclick=()=>show(current+1);$('progress').max=total;$('progress').oninput=e=>show(Number(e.target.value)-1);$('overview-button').onclick=()=>overview(true);$('overview-close').onclick=()=>overview(false);$('notes-button').onclick=toggleNotes;$('fullscreen').onclick=fullscreen;
DATA.titles.forEach((t,i)=>{const b=document.createElement('button'),n=document.createElement('span'),title=document.createElement('strong');n.textContent=String(i+1).padStart(2,'0');title.textContent=t;b.append(n,title);b.onclick=()=>{show(i);overview(false);};$('overview-grid').append(b);});
document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.key==='Escape')overview(false);if(!$('overview').hidden)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1);}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1);}else if(e.key==='Home'){e.preventDefault();show(0);}else if(e.key==='End'){e.preventDefault();show(total-1);}else if(e.key.toLowerCase()==='o')overview(true);else if(e.key.toLowerCase()==='n')toggleNotes();else if(e.key.toLowerCase()==='f')fullscreen();});
window.addEventListener('hashchange',()=>{const n=Number(location.hash.slice(1));if(Number.isInteger(n)&&n>0)show(n-1,false);});
function demoCase(){const d=DATA.cases[Number($('case-choice').value)];$('demo-question').textContent=d.question;for(const side of ['before','after']){$('demo-'+side+'-score').textContent='nDCG@10 '+(100*d.scores[side]).toFixed(2).replace('.',',');$('demo-'+side).replaceChildren();d[side].slice(0,3).forEach(doc=>{const li=document.createElement('li'),small=document.createElement('small'),title=document.createElement('span');title.textContent=doc.title;small.textContent=(doc.relevance===null?'Chưa có nhãn':'Nhãn chuẩn: '+doc.relevance)+' · '+doc.id;li.append(title,small);$('demo-'+side).append(li);});}}
$('case-choice').onchange=demoCase;demoCase();const initial=Number(location.hash.slice(1));show(Number.isInteger(initial)&&initial>0?initial-1:0);
</script></body></html>
